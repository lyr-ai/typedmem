<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Truth Through Time: Plates</title>
<meta name="description" content="Static prototypes of the Temporal Truth Explorer: facts change, facts arrive late, sources disagree. Drawn from TypedMem's own answers.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #f5f0e6; --ink: #2a2826; --muted: #7a7368; --rule: #d8cfbf; --wash: #ede5d6;
  --sage: #4f6f58; --cinnabar: #b8432c; --cinnabar-wash: #f1ddd3; --ochre: #9c7424;
  --serif: Newsreader, Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1a1916; --ink: #ebe5d9; --muted: #9c9587; --rule: #3b3731; --wash: #24221e;
    --sage: #93b69d; --cinnabar: #e2765c; --cinnabar-wash: #3a231d; --ochre: #d0a95b;
  }
}
:root[data-theme="dark"] {
  --paper: #1a1916; --ink: #ebe5d9; --muted: #9c9587; --rule: #3b3731; --wash: #24221e;
  --sage: #93b69d; --cinnabar: #e2765c; --cinnabar-wash: #3a231d; --ochre: #d0a95b;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); }
main { max-width: 900px; margin: 0 auto; padding: 36px 16px 64px; }
.fig { font: 500 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
h1 { font: 600 38px/1.1 var(--serif); margin: 8px 0 6px; letter-spacing: -.01em; }
.lede { font: 400 18px/1.5 var(--serif); color: var(--muted); margin: 0 0 8px; max-width: 60ch; }
.plate { border-top: 1px solid var(--rule); padding: 30px 0 34px; }
.plate h2 { font: 400 28px/1.2 var(--serif); margin: 6px 0 14px; }
.plate svg { display: block; width: 100%; overflow: visible; }
.readout { display: flex; gap: 40px; align-items: flex-end; flex-wrap: wrap; margin: 10px 0 0; }
.readout .k { font: 500 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.readout .v { font: 400 40px/1 var(--serif); }
.readout .v.current { color: var(--sage); }
.readout .v.unresolved { color: var(--cinnabar); font-style: italic; }
.readout .h { font: 400 14px/1.6 var(--mono); color: var(--muted); }
.thesis { font: 400 26px/1.25 var(--serif); margin: 22px 0 0; max-width: 30ch; }
.foot { font: 400 13px/1.5 var(--mono); color: var(--muted); margin-top: 28px; }
/* svg text */
.axis text { font: 400 10.5px var(--mono); fill: var(--muted); letter-spacing: .06em; }
.axis line { stroke: var(--rule); }
.now line { stroke: var(--muted); stroke-dasharray: 2 4; }
.now text { font: 500 10.5px var(--mono); fill: var(--muted); letter-spacing: .1em; }
.val { font: 400 18px var(--serif); fill: var(--muted); }
.val.current { font-weight: 600; fill: var(--ink); }
.val.conflict { fill: var(--ink); }
.src { font: 400 10.5px var(--mono); fill: var(--muted); }
.tag { font: 500 10.5px var(--mono); letter-spacing: .12em; text-transform: uppercase; }
.arr { font: 500 10.5px var(--mono); fill: var(--ochre); }
@media (max-width: 560px) { h1 { font-size: 30px; } .plate h2 { font-size: 23px; } .readout .v { font-size: 32px; } .thesis { font-size: 22px; } }
</style>
</head>
<body>
<main>
  <div class="fig">TypedMem · Truth Through Time · static plates</div>
  <h1>What was true then, and what is true now?</h1>
  <p class="lede">One piece of state, <code id="stateKey"></code>, in three situations. Every value, date, status and source below is TypedMem's own answer, generated by <code>tools/explorer_data.py</code>.</p>
  <div id="plates"></div>
  <p class="foot" id="foot"></p>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="data.js"></script>
<script>
const DATA = window.TRUTH_DATA;
const AS_OF = new Date(DATA.as_of + "T00:00:00Z");
const ORD = ["1st", "2nd", "3rd", "4th"];
const THESIS = {
  change: "The old value isn't false. It is no longer current.",
  late: "It arrived last. It wasn't true last.",
  conflict: "Two sources, one moment. TypedMem doesn't pick.",
};
const utc = s => new Date(s + "T00:00:00Z");
const month = d => d.toLocaleString("en", { month: "short", timeZone: "UTC" }).toUpperCase();

function plate(s, i) {
  const el = d3.select("#plates").append("section").attr("class", "plate");
  el.append("div").attr("class", "fig").text(`Plate ${i + 1} · ${s.title}`);
  el.append("h2").text(s.question);
  const svgWrap = el.append("div");
  const f = s.final;
  const r = el.append("div").attr("class", "readout");
  const cur = r.append("div");
  cur.append("div").attr("class", "k").text("Current");
  if (f.current) cur.append("div").attr("class", "v current").text(f.current);
  else cur.append("div").attr("class", "v unresolved").text("unresolved");
  const hist = r.append("div");
  hist.append("div").attr("class", "k").text(f.current ? "History" : "In conflict");
  const chron = [...f.history].reverse();
  hist.append("div").attr("class", "h").html(f.current
    ? chron.map(h => h.value).join(" → ")
    : f.history.filter(h => h.status === "conflict").map(h => `${h.value} · ${h.sources.join(", ")}`).join("<br>"));
  el.append("p").attr("class", "thesis").text(THESIS[s.key]);
  return { svgWrap, s };
}

function draw({ svgWrap, s }) {
  svgWrap.selectAll("*").remove();
  const W = Math.max(340, svgWrap.node().getBoundingClientRect().width);
  const compact = W < 560;
  const f = s.final;
  const chron = [...f.history].reverse();                 // oldest first = lanes top→bottom
  const late = s.key === "late";
  const top = late ? 78 : 34, lane = compact ? 46 : 52;
  const hasConflict = chron.some(h => h.status === "conflict");
  const H = top + lane * chron.length + 34 + (hasConflict ? 18 : 0);
  const L = compact ? 8 : 12, OPEN = W - (compact ? 10 : 20);
  const x = d3.scaleUtc().domain([utc("2026-01-01"), AS_OF]).range([L, W * (compact ? 0.72 : 0.76)]);
  const nowX = x(AS_OF);
  const svg = svgWrap.append("svg").attr("viewBox", `0 0 ${W} ${H}`).attr("height", H);
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const INK = css("--ink"), SAGE = css("--sage"), CIN = css("--cinnabar"), OCH = css("--ochre"), PAPER = css("--paper");

  // time axis (effective time)
  const ax = svg.append("g").attr("class", "axis");
  const months = d3.utcMonths(utc("2026-01-01"), utc("2026-09-02"));
  months.forEach((m, k) => {
    if (compact && k % 2) return;
    ax.append("line").attr("x1", x(m)).attr("x2", x(m)).attr("y1", H - 24).attr("y2", H - 19);
    ax.append("text").attr("x", x(m)).attr("y", H - 6).attr("text-anchor", "start").text(month(m));
  });
  ax.append("line").attr("x1", L).attr("x2", OPEN).attr("y1", H - 24).attr("y2", H - 24);
  const now = svg.append("g").attr("class", "now");
  now.append("line").attr("x1", nowX).attr("x2", nowX).attr("y1", top - 18).attr("y2", H - 24);
  now.append("text").attr("x", nowX + 5).attr("y", H - 6).text("NOW");

  const yOf = k => top + lane * k + lane / 2;
  const laneOf = new Map(chron.map((h, k) => [h.value, k]));
  const conflictVals = chron.filter(h => h.status === "conflict").map(h => h.value);
  const knotX = OPEN - (compact ? 26 : 40), knotY = conflictVals.length
    ? d3.mean(conflictVals, v => yOf(laneOf.get(v))) : 0;

  // transitions: a value ends (○) where the next one begins (●)
  chron.forEach((h, k) => {
    if (!h.valid_to) return;
    const next = chron.find(n => n.valid_from === h.valid_to);
    if (!next) return;
    const x1 = x(utc(h.valid_to)), y1 = yOf(k), y2 = yOf(laneOf.get(next.value));
    svg.append("path").attr("fill", "none").attr("stroke", INK).attr("stroke-opacity", .3).attr("stroke-width", 1.4)
      .attr("d", `M${x1},${y1} C${x1 + 18},${y1} ${x1 - 6},${y2} ${x1 + 10},${y2}`);
  });

  // threads
  chron.forEach((h, k) => {
    const y = yOf(k), x0 = x(utc(h.valid_from));
    const g = svg.append("g");
    if (h.status === "previous") {
      const x1 = x(utc(h.valid_to));
      g.append("line").attr("x1", x0).attr("x2", x1).attr("y1", y).attr("y2", y)
        .attr("stroke", INK).attr("stroke-opacity", .32).attr("stroke-width", 3).attr("stroke-linecap", "round");
      g.append("circle").attr("cx", x1).attr("cy", y).attr("r", 4.2).attr("fill", PAPER).attr("stroke", INK).attr("stroke-opacity", .45).attr("stroke-width", 1.5);
      g.append("circle").attr("cx", x0).attr("cy", y).attr("r", 3.6).attr("fill", INK).attr("fill-opacity", .4);
    } else if (h.status === "current") {
      const grad = `g-${s.key}`;
      const lg = svg.append("defs").append("linearGradient").attr("id", grad).attr("x1", 0).attr("x2", 1);
      lg.append("stop").attr("offset", 0).attr("stop-color", SAGE).attr("stop-opacity", 1);
      lg.append("stop").attr("offset", (nowX - x0) / (OPEN - x0)).attr("stop-color", SAGE).attr("stop-opacity", 1);
      lg.append("stop").attr("offset", 1).attr("stop-color", SAGE).attr("stop-opacity", 0);
      g.append("rect").attr("x", x0).attr("y", y - 3).attr("width", OPEN - x0).attr("height", 6).attr("rx", 3).attr("fill", `url(#${grad})`);
      g.append("circle").attr("cx", x0).attr("cy", y).attr("r", 4.5).attr("fill", SAGE);
      g.append("circle").attr("cx", nowX).attr("cy", y).attr("r", 7).attr("fill", SAGE).attr("stroke", PAPER).attr("stroke-width", 2);
      g.append("text").attr("class", "tag").attr("x", OPEN).attr("y", compact ? y + 18 : y - 10).attr("text-anchor", "end").attr("fill", SAGE).text("Current");
    } else if (h.status === "conflict") {
      const x1 = knotX, ky = knotY;
      g.append("path").attr("fill", "none").attr("stroke", CIN).attr("stroke-width", 3).attr("stroke-linecap", "round")
        .attr("d", `M${x0},${y} L${nowX - 4},${y} C${nowX + 30},${y} ${x1 - 34},${ky} ${x1},${ky}`);
      g.append("circle").attr("cx", x0).attr("cy", y).attr("r", 4.2).attr("fill", CIN);
    }
    const present = h.status !== "previous" && nowX - x0 < 120;
    const badge = late ? 20 : 0;
    const lx = (present ? nowX + 12 : x0 + 2) + badge;
    const conflictIdx = conflictVals.indexOf(h.value);
    const below = conflictIdx === conflictVals.length - 1 && conflictIdx > 0;
    const above = conflictIdx === 0 && conflictVals.length > 1;
    const vy = below ? y + 22 : above ? y - 25 : y - 11;
    const sy = below ? y + 36 : above ? y - 10 : y + 18;
    g.append("text").attr("class", `val ${h.status}`).attr("x", lx).attr("y", vy).text(h.value);
    g.append("text").attr("class", "src").attr("x", compact ? lx - badge : lx).attr("y", sy)
      .text(h.sources.join(", ") + (compact ? "" : `  · from ${h.valid_from.slice(5)}`));
    if (late) {                                 // order of arrival, as a numbered badge
      const n = s.steps.find(st => st.value === h.value).arrival;
      g.append("circle").attr("cx", lx - 12).attr("cy", vy - 5).attr("r", 7.5)
        .attr("fill", "none").attr("stroke", OCH).attr("stroke-width", 1.2);
      g.append("text").attr("class", "arr").attr("x", lx - 12).attr("y", vy - 1.5)
        .attr("text-anchor", "middle").text(n);
    }
  });

  // the knot: no winner
  if (conflictVals.length) {
    const k = svg.append("g").attr("stroke", CIN).attr("stroke-width", 2.2).attr("fill", "none");
    k.append("circle").attr("cx", knotX).attr("cy", knotY).attr("r", 9).attr("fill", css("--cinnabar-wash"));
    k.append("path").attr("d", `M${knotX - 5},${knotY - 5} L${knotX + 5},${knotY + 5} M${knotX + 5},${knotY - 5} L${knotX - 5},${knotY + 5}`);
    svg.append("text").attr("class", "tag").attr("x", compact ? OPEN : knotX + 16).attr("y", knotY + (compact ? -16 : 4))
      .attr("text-anchor", compact ? "end" : "start").attr("fill", CIN).text("no winner");
  }

  // the late arrival: where it came in (now) vs where it belongs (its own time)
  if (late) {
    svg.append("text").attr("class", "arr").attr("x", L).attr("y", 30).text("① ② ③  order of arrival");
    svg.append("text").attr("class", "src").attr("x", L).attr("y", 46).text("position  when it was true");
    const last = s.steps[s.steps.length - 1];
    const h = chron.find(c => c.value === last.value);
    const tx = x(utc(h.valid_from)), ty = yOf(laneOf.get(h.value));
    const gw = compact ? 96 : 130;
    const gx = nowX - gw / 2, gy = 16;
    svg.append("rect").attr("x", gx).attr("y", gy).attr("width", gw).attr("height", 30).attr("rx", 4)
      .attr("fill", "none").attr("stroke", OCH).attr("stroke-dasharray", "4 3").attr("stroke-width", 1.4);
    svg.append("text").attr("class", "val").attr("x", gx + 10).attr("y", gy + 21).attr("fill", OCH).style("fill", OCH).text(last.value);
    if (compact) {
      svg.append("text").attr("class", "arr").attr("x", gx + gw / 2).attr("y", gy + 44).attr("text-anchor", "middle")
        .text(`arrives last · says ${last.valid_from.slice(5)}`);
    } else {
      svg.append("text").attr("class", "arr").attr("x", gx + gw + 8).attr("y", gy + 12).text("arrives last");
      svg.append("text").attr("class", "arr").attr("x", gx + gw + 8).attr("y", gy + 26).text(`says: from ${last.valid_from.slice(5)}`);
    }
    const ax0 = gx, ay0 = gy + 15;
    svg.append("path").attr("fill", "none").attr("stroke", OCH).attr("stroke-width", 1.4).attr("stroke-dasharray", "4 3")
      .attr("marker-end", "url(#arrowhead)")
      .attr("d", `M${ax0},${ay0} C${ax0 - 120},${ay0 - 8} ${tx + 30},${ty - 70} ${tx + 6},${ty - 28}`);
    const m = svg.append("defs").append("marker").attr("id", "arrowhead").attr("viewBox", "0 0 10 10")
      .attr("refX", 6).attr("refY", 5).attr("markerWidth", 7).attr("markerHeight", 7).attr("orient", "auto-start-reverse");
    m.append("path").attr("d", "M0,0 L10,5 L0,10 z").attr("fill", OCH);
  }
}

document.getElementById("stateKey").textContent = DATA.scenarios[0].state_key;
document.getElementById("foot").textContent = `Data: ${DATA.source}, evaluated as of ${DATA.as_of}.`;
const plates = DATA.scenarios.map(plate);
const redraw = () => plates.forEach(draw);
redraw();
let t; addEventListener("resize", () => { clearTimeout(t); t = setTimeout(redraw, 120); });
</script>
</body>
</html>
